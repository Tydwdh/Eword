[package]
name = "eword"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A minimal terminal vocabulary spelling trainer"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
ratatui = "0.30.2"
ratatui-textarea = "0.9.4"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = { version = "3.2.1", features = ["inline", "unicode"] }
strsim = "0.11.1"
tempfile = "3.27.0"
terminal-colorsaurus = "1.0.3"
time = { version = "0.3.55", features = ["formatting", "macros", "local-offset"] }
toml = "1.2.0"
unicode-normalization = "0.1.26"
unicode-width = "0.2.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
